[package]
name = "cunzhi"
version = "0.6.4"
edition = "2021"
default-run = "iterate"

[lib]
path = "src/rust/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "iterate"
path = "src/rust/main.rs"

[[bin]]
name = "寸止"
path = "src/rust/bin/mcp_server.rs"
required-features = ["legacy-cunzhi-bin"]

[[bin]]
name = "mcp-server"
path = "src/bin/mcp-server.rs"

[dependencies]
libc = "0.2"
tauri = { version = "2.9.1", features = ["macos-private-api",
  "tray-icon",
  "image-ico",
  "image-png"
] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-updater = "2.0.0"
tauri-plugin-global-shortcut = "2.0.0"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-clipboard-manager = "2.3.2"
serde = { version = "1.0", features = [ "derive" ] }
serde_json = "1.0"
tokio = { version = "1.0", features = [
  "rt-multi-thread", # MCP服务器和异步任务需要
  "macros", # #[tokio::main] 宏需要
  "fs", # 文件操作需要
  "io-util",
  "net",
  "process", # Command::new() 需要
  "sync", # oneshot channel 需要
  "time" # sleep() 需要
] }
anyhow = "1.0.103"
thiserror = "1.0"
uuid = { version = "1.0", features = [ "v4" ] }
chrono = { version = "0.4", features = [ "serde" ] }
dirs = "5.0"
rmcp = { version = "1.4.0", default-features = false, features = [
  "server",
  "client",
  "transport-io",
  "transport-child-process"
] }
schemars = "0.8"
rodio = "0.19"
reqwest = { version = "0.12.24", default-features = false, features = [
  "stream",
  "json",
  "http2",
  "native-tls-alpn"
] }
base64 = "0.21"
base64_013 = { package = "base64", version = "0.13" }
web-push-native = { version = "0.5.0", default-features = false }
rust-embed = "8.0"
teloxide = { version = "0.15.0", features = [ "macros" ] }
regex = "1.0"
log = "0.4.27"
env_logger = "0.11.8"
jsonwebtoken = { version = "10.3.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
percent-encoding = "2.3"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = [
  "std",
  "ring"
] }
hex = "0.4"
ignore = "0.4"
encoding_rs = "0.8"
globset = "0.4"
# 浏览器 CDP 监控
chromiumoxide = { version = "0.7", features = [ "tokio-runtime" ], default-features = false }
futures = "0.3"
once_cell = "1.19"
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"
axum = { version = "0.7", features = [ "ws" ] }
tower-http = { version = "0.5", features = [
  "fs",
  "cors"
] }
parking_lot = "0.12" # 高效的同步原语，用于 zhi 授权状态追踪
portable-pty = "0.9.0"
tempfile = "3.10"
native-tls = "0.2"
rusqlite = { version = "0.39.0", features = ["bundled"] }
keyring = "3"

[build-dependencies]
cc = "1"
tauri-build = { version = "2.0", features = [] }

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
legacy-cunzhi-bin = []

# 发布版本优化配置
[profile.release]
opt-level = "z" # 优化体积而非速度
lto = true # 链接时优化，减少最终二进制大小
codegen-units = 1 # 减少代码生成单元，提高优化效果
panic = "abort" # 减少panic处理代码
strip = "debuginfo" # 保留 Android JNI 入口符号，仅移除调试信息

[target.'cfg(not(target_os = "windows"))'.dependencies]
openssl = { version = "0.10.80", features = ["vendored"] }

[target.'cfg(target_os = "macos")'.dependencies]
 cocoa = "0.26.1"
core-foundation = "0.10.1"
core-graphics = { version = "0.25.0", features = ["elcapitan"] }
objc = "0.2.7"
security-framework = "3.7"

[target.'cfg(target_os = "windows")'.dependencies]
fs2 = "0.4"
reqwest = { version = "0.12.24", default-features = false, features = [
  "blocking",
  "stream",
  "json",
  "http2",
  "native-tls-alpn"
] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading"
] }
