name: Build Windows Package

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: Windows 安装包名称（不带 .zip）
        required: true
        default: iterate-windows-x64
        type: string
      git_ref:
        description: 要构建的 Git ref（留空则使用当前分支/提交）
        required: false
        default: ''
        type: string
      enable_fallback_release:
        description: Artifact 上传失败时是否允许发布 fallback prerelease
        required: true
        default: false
        type: boolean

jobs:
  build-windows-package:
    name: Build Windows Package
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
      CARGO_PROFILE_RELEASE_OPT_LEVEL: 3
      ITERATE_RELEASE_PUBLIC_KEY_B64: ${{ secrets.ITERATE_RELEASE_PUBLIC_KEY_B64 }}
      ITERATE_REQUIRE_ACTIVATION: '0'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_ref != '' && inputs.git_ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (2026-08-05)

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Validate release public key
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ITERATE_RELEASE_PUBLIC_KEY_B64)) {
            throw "ITERATE_RELEASE_PUBLIC_KEY_B64 secret is required so Windows updater verification has an embedded public key"
          }

      - name: Build mcp-server binary
        run: cargo build --release --bin mcp-server

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Windows experience changes
        shell: pwsh
        run: |
          pnpm run lint:check
          cargo check --lib --bins
          cargo test --test windows_window_registry
          pnpm run test:windows-experience
          pnpm run test:desktop-community-activation

      - name: Build Windows binaries and NSIS installer
        run: pnpm exec tauri build --bundles nsis

      - name: Collect NSIS installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "target\release\bundle\nsis\*-setup.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) {
            throw "NSIS installer was not produced"
          }
          Copy-Item -LiteralPath $installer.FullName -Destination "${{ inputs.package_name }}-setup.exe" -Force

      - name: Package Windows bundle
        shell: pwsh
        run: |
          $packageName = "${{ inputs.package_name }}"
          $packageDir = "windows-package"
          $appDir = Join-Path $packageDir "app"
          $webViewLoaderPath = node ./scripts/select-windows-x64-webview2-loader.mjs target

          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($webViewLoaderPath)) {
            throw "未找到 x86-64 WebView2Loader.dll，打包中止"
          }

          if (Test-Path $packageDir) {
            Remove-Item $packageDir -Recurse -Force
          }

          New-Item -ItemType Directory -Path $appDir -Force | Out-Null

          Copy-Item "target\\release\\iterate.exe" "$appDir\\"

          if (-not (Test-Path "target\\release\\mcp-server.exe")) {
            throw "缺少 target\\release\\mcp-server.exe，打包中止"
          }

          if (-not (Test-Path -LiteralPath $webViewLoaderPath -PathType Leaf)) {
            throw "x86-64 WebView2Loader.dll 路径无效：$webViewLoaderPath"
          }

          Copy-Item "target\\release\\mcp-server.exe" "$appDir\\"
          Copy-Item -LiteralPath $webViewLoaderPath "$appDir\\WebView2Loader.dll"
          Copy-Item "docs\\INSTALLATION.md" "$packageDir\\INSTALLATION.md"
          Copy-Item "docs\\INSTALL_PROMPT.md" "$packageDir\\INSTALL_PROMPT.md"
          Copy-Item "docs\\SYSTEM_PROMPT.md" "$packageDir\\SYSTEM_PROMPT.md"
          Copy-Item "release-package\\windows\\Install iterate.bat" "$packageDir\\Install iterate.bat"
          Copy-Item "release-package\\windows\\Start iterate.bat" "$packageDir\\Start iterate.bat"

          if (Test-Path "$packageName.zip") {
            Remove-Item "$packageName.zip" -Force
          }

          Compress-Archive -Path "$packageDir" -DestinationPath "$packageName.zip" -Force

      - name: Smoke Windows package layout
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/windows-install-smoke.ps1 -PackageDir windows-package

      - name: Smoke NSIS install, shortcuts, launch, and uninstall
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/windows-installer-smoke.ps1 -InstallerPath "${{ inputs.package_name }}-setup.exe" -Install

      - name: Upload Windows package artifact
        id: upload_artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        continue-on-error: true
        with:
          name: ${{ inputs.package_name }}
          path: |
            ${{ inputs.package_name }}.zip
            ${{ inputs.package_name }}-setup.exe
          retention-days: 1

      - name: Fallback upload to prerelease
        if: steps.upload_artifact.outcome == 'failure' && inputs.enable_fallback_release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          tag_name: windows-package-latest
          target_commitish: ${{ github.sha }}
          name: Windows Package Latest
          body: |
            Fallback upload for manual Windows package builds when GitHub Actions artifact storage is unavailable.

            - Branch: `${{ github.ref_name }}`
            - Commit: `${{ github.sha }}`
            - Run: `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`
            - Package: `${{ inputs.package_name }}.zip`
          draft: false
          prerelease: true
          generate_release_notes: false
          files: |
            ${{ inputs.package_name }}.zip
            ${{ inputs.package_name }}-setup.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
