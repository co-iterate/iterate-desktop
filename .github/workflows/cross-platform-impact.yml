name: Cross-Platform Impact

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  impact:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      windows_rust_check: ${{ steps.changed.outputs.windows_rust_check }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*

      - name: Collect changed files
        id: changed
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" > changed-files.txt
          else
            git diff-tree --no-commit-id --name-only -r HEAD > changed-files.txt
          fi

          cat changed-files.txt

          if grep -Eq '^(Cargo\.(toml|lock)|build\.rs|src/(bin|rust)/)' changed-files.txt; then
            echo "windows_rust_check=true" >> "$GITHUB_OUTPUT"
          else
            echo "windows_rust_check=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate impact tasks
        shell: bash
        run: |
          mapfile -t files < changed-files.txt
          node ./scripts/iterate-cross-platform-impact.mjs \
            "${files[@]}" \
            --json \
            --tasks-md cross-platform-impact-tasks.md \
            > cross-platform-impact.json

          cat cross-platform-impact-tasks.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment impact tasks on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs')

            const marker = '<!-- iterate-cross-platform-impact -->'
            const tasks = fs.readFileSync('cross-platform-impact-tasks.md', 'utf8')
            const body = `${marker}\n${tasks}`
            const { owner, repo } = context.repo
            const issue_number = context.payload.pull_request.number

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            })
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            )

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              })
            }

      - name: Upload impact artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cross-platform-impact
          path: |
            changed-files.txt
            cross-platform-impact.json
            cross-platform-impact-tasks.md
          if-no-files-found: error

  windows-rust-check:
    name: Windows Rust compile gate
    needs: impact
    if: needs.impact.outputs.windows_rust_check == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CARGO_PROFILE_DEV_DEBUG: 0

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (2026-08-05)

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: windows-rust-check

      - name: Compile shared Rust targets on Windows
        run: cargo check --locked --lib --bin mcp-server
