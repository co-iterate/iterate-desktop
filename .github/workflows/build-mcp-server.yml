name: Build MCP Server

on:
  push:
    tags: ['v*']
    paths:
      - src/bin/mcp-server.rs
      - src/rust/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/build-mcp-server.yml
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macos-aarch64
            ext: ''
          - platform: macos-latest
            target: x86_64-apple-darwin
            name: macos-x86_64
            ext: ''
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
            ext: ''
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            ext: .exe

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (2026-08-05)
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: root-mcp-server-${{ matrix.target }}

      - name: Build mcp-server
        shell: bash
        env:
          CARGO_PROFILE_RELEASE_LTO: ${{ matrix.platform == 'windows-latest' && 'thin' || 'true' }}
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ matrix.platform == 'windows-latest' && '16' || '1' }}
        run: |
          cargo build --release --target ${{ matrix.target }} --bin mcp-server

      - name: Create package
        shell: bash
        run: |
          mkdir -p mcp-package
          TAG_NAME="${{ github.ref_name }}"

          if [[ "${{ matrix.platform }}" == "windows-latest" ]]; then
            cp "target/${{ matrix.target }}/release/mcp-server${{ matrix.ext }}" mcp-package/
            cd mcp-package
            7z a ../mcp-server-${TAG_NAME}-${{ matrix.name }}.zip *
          else
            cp "target/${{ matrix.target }}/release/mcp-server${{ matrix.ext }}" mcp-package/
            cd mcp-package
            tar -czf ../mcp-server-${TAG_NAME}-${{ matrix.name }}.tar.gz *
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mcp-server-${{ matrix.name }}
          path: |
            mcp-server-*.tar.gz
            mcp-server-*.zip
          if-no-files-found: ignore

  release:
    name: Add to Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Upload to Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            artifacts/*/mcp-server-*.tar.gz
            artifacts/*/mcp-server-*.zip
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
